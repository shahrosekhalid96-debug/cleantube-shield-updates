name: Build signed update

on:
  schedule:
    - cron: "17 2 * * 0"      # every Sunday 05:17 Riyadh time
  push:
    branches: [main]
    paths: ["src/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Build and sign
        env:
          SHIELD_PRIVATE_KEY: ${{ secrets.SHIELD_PRIVATE_KEY }}
        run: python tools/build.py
      - name: Publish
        run: |
          git config user.name "cleantube-bot"
          git config user.email "cleantube-bot@users.noreply.github.com"
          git add dist/
          git commit -m "Signed update $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase
          git push
